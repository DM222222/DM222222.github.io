<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Protótipo navegável — Ler a planta num relance</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../logo-dm.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>/* Ler a planta num relance: protótipo responsivo.
   Mesmo design system das 9 telas do deck (tokens, tipos, medidas), agora fluido. */
:root{--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);transition:background .25s,color .25s}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:#0A0A0A;color:#fff;padding:.6rem .9rem;z-index:100}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- barra do protótipo (fora do produto) ---------- */
.pbar{background:var(--surface);border-bottom:1px solid var(--divider);position:sticky;top:0;z-index:40}
.pbar>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;font-size:13px;color:var(--ink2);min-height:44px}
.pbar>summary::-webkit-details-marker{display:none}
.pbar>summary b{color:var(--ink);font-weight:600}
.pbar>summary .opt{font:500 12px var(--sans);border:1px solid var(--line);border-radius:99px;padding:6px 12px;color:var(--ink)}
.pbar[open]>summary .opt::after{content:" ▴"}.pbar:not([open])>summary .opt::after{content:" ▾"}
.pbar .ctl{display:flex;align-items:center;flex-wrap:wrap;gap:8px 18px;padding:0 16px 10px}
.fld{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.pbar select{font:inherit;font-size:13px;min-height:44px;padding:0 10px;border:1px solid var(--fieldLine);border-radius:6px;background:var(--field);color:#14161a}
.tema{display:flex;align-items:center;gap:4px 14px;border:0;margin:0;padding:0;font-size:13px;color:var(--ink2)}
.tema legend{float:left;padding:0;margin-right:10px;font-size:13px}
.tema label{display:inline-flex;align-items:center;gap:6px;min-height:44px;cursor:pointer;color:var(--ink)}
.tema input{width:18px;height:18px;accent-color:var(--accent)}
.rst{font:500 13px var(--sans);min-height:44px;padding:0 18px;border:1px solid var(--ink);border-radius:99px;background:transparent;color:var(--ink);cursor:pointer}
.rst:hover{background:var(--ink);color:var(--onInk)}
.hint{margin:0;padding:8px 16px;font-size:12.5px;color:var(--ink2);background:var(--surface2);border-bottom:1px solid var(--line)}

/* ---------- app ---------- */
.app{min-height:calc(100vh - 56px);background:var(--bg);font-family:var(--sans);color:var(--ink);padding-bottom:0}
.app button,.app [role=button]{cursor:pointer}
.app [data-act]:focus-visible,.app button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--divider)}
.top .l,.top .r{display:flex;align-items:center;gap:22px;min-width:0}
.top .r{gap:12px}
.brand{display:flex;align-items:center;gap:8px}
.logo{width:24px;height:24px;border-radius:50%;background:repeating-linear-gradient(45deg,var(--ph) 0 4px,transparent 4px 8px);border:1px solid var(--line);flex:none}
.brand .nm{font:500 16px var(--mono);letter-spacing:.04em;color:var(--ink);white-space:nowrap}
.nav{display:flex;gap:20px;font:500 13px var(--sans)}
.nav button{background:none;border:0;padding:0 0 3px;color:var(--ink2);border-bottom:2px solid transparent;min-height:24px}
.nav button[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}
.meta{font:400 11px var(--mono);color:var(--ink2);white-space:nowrap}
.pill-ai{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;background:var(--okBg);border:1px solid var(--ok);border-radius:15px;font:600 11px var(--sans);color:var(--okInk);white-space:nowrap}
.pill-ai.off{background:var(--errBg);border-color:var(--errLine);color:var(--danger)}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 11px var(--sans);color:var(--onAccent);background:var(--accent);flex:none}
.btn-o{height:32px;padding:0 14px;font:500 12px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px}
.btn-d{height:32px;padding:0 14px;font:600 12px var(--sans);color:var(--onAccent);background:var(--danger);border:0;border-radius:6px}
.btn-d.ok{background:var(--ok)}
.btn-p{height:46px;padding:0 20px;font:600 13.5px var(--sans);color:var(--onAccent);background:var(--accent);border:0;border-radius:6px}
.btn-g{height:46px;padding:0 20px;font:500 13.5px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px}
.btn-p[aria-disabled=true]{opacity:.75}
.tabs{display:none}

/* alarme */
.alarm{display:flex;align-items:stretch;background:var(--errBg);border-bottom:1px solid var(--errLine)}
.alarm.ok{background:var(--okBg);border-bottom-color:var(--ok)}
.alarm .a-l{display:flex;align-items:center;gap:10px;padding:11px 20px;border-right:1px solid var(--errLine);white-space:nowrap}
.alarm.ok .a-l{border-right-color:var(--ok)}
.alarm .n{font:600 13px var(--mono);color:var(--danger)}
.alarm .t{font:600 12px var(--sans);letter-spacing:.06em;color:var(--danger)}
.alarm.ok .n,.alarm.ok .t{color:var(--okInk)}
.alarm .a-m{flex:1;display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;padding:11px 18px;min-width:0}
.alarm .a-m .msg{font:500 13.5px var(--sans);color:var(--ink)}
.alarm .a-m .when{font:400 11px var(--mono);color:var(--ink2)}
.alarm .a-b{display:flex;align-items:center;gap:8px;padding:9px 18px}

/* cards e tipos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.lbl{font:600 10.5px var(--sans);letter-spacing:.12em;color:var(--ink2)}
.m3{font:400 10.5px var(--mono);color:var(--ink3)}
.m2{font:400 10.5px var(--mono);color:var(--ink2)}
.sec{font:600 12px var(--sans);letter-spacing:.11em;color:var(--ink)}
.mini{font:600 10px var(--mono);letter-spacing:.11em;color:var(--ink2)}
.link{color:var(--link);font:500 12px var(--sans)}
.pad{padding:16px 20px}
.home-k{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px 20px 0}
.home-b{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;padding:14px 20px 20px}
.kpi{padding:16px 18px;min-width:0}
.kpi .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kpi .v{display:flex;align-items:flex-end;flex-wrap:wrap;gap:0 9px;padding:8px 0 6px}
.kpi .v .big{font:400 50px/1 var(--sans);color:var(--ink)}
.kpi .v .u{font:400 18px var(--sans);color:var(--ink2);padding-bottom:5px}
.kpi .v .d{font:500 14px var(--sans);color:var(--okInk);padding-bottom:7px}
.kpi .v .s{font:600 13px var(--sans);padding-bottom:7px}
.kpi .v .u.sm{font-size:16px;padding-bottom:6px}
.ok-t{color:var(--okInk)}.er-t{color:var(--danger)}
.scale{display:flex;justify-content:space-between;font:400 10px var(--mono);color:var(--ink3);padding-top:4px;gap:8px}
.bandbar{position:relative;height:26px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bandbar .b{position:absolute;top:0;bottom:0;background:var(--okBg);border-left:1px solid var(--ok);border-right:1px solid var(--ok)}
.bandbar .p{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--accent)}
.bars{display:flex;gap:3px;height:26px}
.bars i{flex:1;background:var(--ok);border-radius:2px}
.bars i.x{background:var(--danger)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px}
.chip{padding:4px 10px;font:500 10px var(--mono);color:var(--ink2);border:1px solid var(--line);border-radius:11px;background:transparent;min-height:28px}
.chip[aria-pressed=true]{font-weight:600;color:var(--onInk);background:var(--ink);border-color:var(--ink)}
.chartbox{padding:14px 16px 10px}
.chartbox svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:2px 22px;font:400 11px var(--mono);color:var(--ink3);padding:2px 0 0 40px}
.logrow{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.logrow .tm{font:400 11px var(--mono);color:var(--ink3);padding-top:2px;min-width:38px}
.logrow .ti{font:500 13px var(--sans);color:var(--ink)}
.logrow .ds{font:400 12px/1.45 var(--sans);color:var(--ink2)}
.logrow .ti.er{color:var(--danger)}.logrow .ti.ok{color:var(--okInk)}
.more{display:block;width:100%;background:none;border:0;padding:11px 16px;text-align:center;font:500 12px var(--sans);color:var(--link);min-height:44px}

/* circuitos */
.tool{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--divider)}
.tool .site{height:28px;padding:0 12px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font:500 11.5px var(--sans);color:var(--ink)}
.seg{display:flex;gap:6px}
.pillbtn{height:28px;padding:0 12px;display:flex;align-items:center;font:500 11px var(--sans);letter-spacing:.05em;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pillbtn[aria-pressed=true]{font-weight:600;color:var(--onInk);background:var(--ink);border-color:var(--ink)}
.key{margin-left:auto;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font:400 11px var(--mono);color:var(--ink2)}
.key span{display:inline-flex;align-items:center;gap:5px}
.key i{width:9px;height:9px;border-radius:2px;display:inline-block}
.flowcard{margin:18px 20px 0;padding:18px 20px}
.flowcard .fh{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;padding-bottom:16px}
.flow{display:flex;align-items:stretch}
.stage{flex:1;text-align:left;border:1px solid var(--line);border-top:3px solid var(--ok);border-radius:6px;padding:13px 15px;background:transparent;color:inherit;min-width:0}
.stage.na{border-top-color:var(--ink3)}
.stage.er{flex:1.25;border:1.5px solid var(--danger);border-top:3px solid var(--danger);background:var(--errBg)}
.stage .sn{display:flex;justify-content:space-between;align-items:center;font:600 11.5px var(--sans);letter-spacing:.06em;color:var(--ink)}
.stage .sn b{font:600 11px var(--mono);color:var(--danger)}
.stage .sv{font:400 26px/1.2 var(--sans);color:var(--ink);padding-top:5px}
.stage .sv span{font-size:12px;color:var(--ink2)}
.stage .sx{font:400 10.5px var(--mono);color:var(--ink2);padding-top:3px}
.stage.er .sx{color:var(--danger)}
.arrow{width:34px;display:flex;align-items:center;justify-content:center;font:400 15px var(--mono);color:var(--ink3);flex:none}
.ccards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px 20px 20px}
.cc{overflow:hidden;min-width:0}
.cc .ch{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:var(--surface2);border-bottom:1px solid var(--line)}
.cc.er .ch{background:var(--errBg);border-bottom-color:var(--errLine)}
.cc .ch b{font:600 12.5px var(--sans);letter-spacing:.08em;color:var(--ink)}
.cc .ch span{font:600 11px var(--mono);color:var(--okInk)}
.cc.er .ch span{color:var(--danger)}
.cc .sp{padding:14px 16px}.cc .sp svg{display:block;width:100%;height:64px}
.pr{display:flex;justify-content:space-between;gap:10px;padding:9px 16px;border-top:1px solid var(--line);font:400 12.5px var(--sans);color:var(--ink2)}
.pr.er{color:var(--danger)}
.pr span{font-family:var(--mono);color:var(--ink)}.pr.er span{color:var(--danger)}
.cc .open{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 16px;min-height:44px}

/* parâmetros */
.pgrid{display:grid;grid-template-columns:210px minmax(0,1fr) 400px;align-items:stretch;min-height:calc(100vh - 160px)}
.pgrid.closed{grid-template-columns:210px minmax(0,1fr)}
.pside{padding:14px;border-right:1px solid var(--divider);background:var(--surface2);display:flex;flex-direction:column;gap:18px}
.pside .grp>.mini{padding-bottom:8px}
.ci{display:flex;justify-content:space-between;width:100%;text-align:left;padding:7px 10px;font:400 12.5px var(--sans);color:var(--ink2);background:transparent;border:1px solid transparent;border-radius:4px;min-height:32px}
.ci[aria-pressed=true]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:500}
.ci span{font:400 10.5px var(--mono);color:var(--ink3)}
.flt{display:flex;flex-direction:column;gap:7px;font:400 12.5px var(--sans);color:var(--ink)}
.flt .r{display:flex;gap:8px;align-items:center}
.flt .bx{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);background:var(--surface);flex:none}
.flt .bx.on{background:var(--accent);border-color:var(--accent)}
.flt em{font:400 10.5px var(--mono);font-style:normal;color:var(--ink3)}
.pmain{padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pmain .th{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 12px}
.pmain .lg{display:flex;gap:12px;font:400 10.5px var(--mono);color:var(--ink2)}
.pmain .lg span{display:inline-flex;align-items:center;gap:5px}
.lg i.b{width:12px;height:10px;background:var(--okBg);border:1px solid var(--ok)}
.lg i.a{width:3px;height:12px;background:var(--accent)}
.ptab{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.prow,.phead{display:grid;grid-template-columns:minmax(0,1fr) 200px 96px 96px;align-items:center;gap:0 8px;padding:11px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;color:inherit}
.phead{padding:9px 16px;background:var(--surface2);font:600 10.5px var(--sans);letter-spacing:.06em;color:var(--ink2)}
.phead span:nth-child(n+3){text-align:right}
.prow:last-child{border-bottom:0}
.prow.sel{background:var(--accentSoft)}
.prow.er{background:var(--errBg)}
.prow .nm{font:400 13.5px var(--sans);color:var(--ink);overflow-wrap:anywhere}
.prow.sel .nm,.prow.er .nm{font-weight:500}
.prow.er .nm{color:var(--danger)}
.prow .nm small{font:400 10.5px var(--mono);color:var(--ink2);margin-left:4px}
.prow.nosig .nm{color:var(--ink2)}
.prow .rb{position:relative;height:20px;background:var(--surface2);border-radius:3px}
.prow.sel .rb,.prow.er .rb{background:var(--surface)}
.rb .b{position:absolute;top:0;bottom:0;background:var(--okBg);border-left:1px solid var(--ok);border-right:1px solid var(--ok)}
.rb .p{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--accent)}
.rb .p.x{background:var(--danger)}
.rb.ns{background:repeating-linear-gradient(45deg,var(--surface2) 0 6px,var(--surface) 6px 12px);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font:400 10px var(--mono);color:var(--ink3)}
.prow .ac{text-align:right;font:400 13.5px var(--mono);color:var(--ink)}
.prow.sel .ac,.prow.er .ac{font-weight:500}
.prow.er .ac{color:var(--danger)}
.prow .tg{text-align:right;font:400 13.5px var(--mono);color:var(--accentInk)}
.prow .tg.dash,.prow .ac.dash{color:var(--ink3);font-size:12px}
.prow .go{display:none}
.note{display:flex;align-items:center;gap:9px;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;font:400 12.5px/1.5 var(--sans);color:var(--ink2)}
.drawer{background:var(--surface);border-left:1px solid var(--divider);padding:18px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.drawer .dh{display:flex;align-items:center;justify-content:space-between}
.drawer .x{background:none;border:0;font:400 14px var(--sans);color:var(--ink3);width:44px;height:44px;margin:-10px -12px -10px 0}
.drawer h3{margin:0;font:600 17px/1.35 var(--sans);color:var(--ink);overflow-wrap:anywhere}
.drawer .sub{font:400 11.5px var(--mono);color:var(--ink2);padding-top:4px}
.cmp{display:flex;align-items:flex-end;gap:12px}
.cmp .k{font:400 10.5px var(--mono);color:var(--ink3)}
.cmp .a{font:400 34px/1.1 var(--sans);color:var(--danger)}
.cmp .a.ok{color:var(--okInk)}
.cmp .t{font:500 34px/1.1 var(--sans);color:var(--accentInk)}
.cmp .ar{font:400 16px var(--mono);color:var(--ink3);padding-bottom:7px}
.why{padding:13px 15px;background:var(--surface2);border-radius:6px;display:flex;flex-direction:column;gap:8px}
.why p{margin:0;font:400 12.5px/1.6 var(--sans);color:var(--ink);text-wrap:pretty}
.why .cf{display:flex;flex-wrap:wrap;gap:4px 18px;font:400 11px var(--mono);color:var(--ink2)}
.ovr{display:flex;flex-direction:column;gap:7px}
.ovr>label{font:500 12.5px var(--sans);color:var(--ink)}
.ovr .row{display:flex;gap:8px;align-items:center}
.fieldval{flex:1;height:44px;display:flex;align-items:center;padding:0 12px;background:var(--field);border:1px solid var(--fieldLine);border-radius:6px;font:500 15px var(--mono);color:#14161a}
.step{width:44px;height:44px;font:400 18px var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px}
.dact{display:flex;gap:10px}
.dact .btn-g{flex:1}.dact .btn-p{flex:1.5}
.last{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:9px}
.last div{display:flex;justify-content:space-between;gap:10px;font:400 11.5px var(--sans);color:var(--ink2)}
.last div span{font-family:var(--mono)}
.scrim{display:none}

/* histórico */
.hbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 8px;padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--divider)}
.hbar .chip{height:28px;font:500 10.5px var(--sans);letter-spacing:.05em;padding:0 12px;border-radius:14px;background:var(--surface)}
.hbar .chip[aria-pressed=true]{background:var(--ink)}
.hbar .sel{margin-left:8px;height:28px;padding:0 12px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font:500 11.5px var(--sans);color:var(--ink)}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;padding:16px 20px 20px;align-items:start}
.hcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.hchart{padding:14px 16px 12px}
.hchart .hh{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;padding-bottom:10px}
.hchart svg{display:block;width:100%;height:auto}
.hchart [data-ev]{cursor:pointer}
.htab{overflow:hidden}
.hrow{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:0 8px;padding:12px 16px;border-top:1px solid var(--line);font:400 13px var(--sans);color:var(--ink);align-items:center}
.hrow.h{border-top:0;background:var(--surface2);padding:10px 16px;font:600 10.5px var(--sans);letter-spacing:.06em;color:var(--ink2)}
.hrow.off{background:var(--errBg)}.hrow.df{background:var(--surface3)}
.hrow>:nth-child(n+2){text-align:right;font-family:var(--mono)}
.hrow.h>:nth-child(n+2){font-family:var(--sans)}
.hrow .g{color:var(--okInk)}
.ev{display:flex;gap:16px;padding:11px 16px;border-top:1px solid var(--line);text-align:left;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;color:inherit}

.rmain{padding:16px 24px 24px;min-width:0}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:28px 40px 24px;color:var(--ink)}

.co{display:flex;gap:14px;padding:11px 0;border-top:1px solid var(--line);font:400 13.5px var(--sans);align-items:baseline}

/* login */

.aibox{margin-top:12px;display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--okBg);border:1px solid var(--ok);border-radius:4px;font:400 13px var(--sans);color:var(--okInk)}

.fl{display:flex;flex-direction:column;gap:6px}

.ln{color:var(--link);text-decoration:underline;background:none;border:0;padding:0;font:inherit;min-height:24px}

/* widgets */
.wg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px;padding:20px}

.track{height:10px;background:var(--surface2);border-radius:2px;overflow:hidden}

.cd{font:500 60px/1 var(--mono)}

/* fluxo: desligar a IA */

.fc .acts .btn-g,.fc .acts .btn-d,.fc .acts .btn-p{height:44px;flex:1;font-size:13.5px}
.fc .acts .btn-d{flex:1.4;height:44px;font-size:13.5px;position:relative;overflow:hidden}

      rows.map(function (x) { return '<div class="prow' + (x[6] ? ' er' : '') + (x[7] ? ' nosig' : '') + '"><div class="nm">' + x[0] + '<small>' + x[1] + '</small></div>' + (x[7] ? '<div class="rb ns">NO SIGNAL SINCE 14:02</div>' : '<div class="rb"><div class="b" style="left:' + x[2] + '%;width:' + x[3] + '%"></div><div class="p' + (x[6] ? ' x' : '') + '" style="left:' + x[4] + '%"></div></div>') + '<div class="ac' + (x[7] ? ' dash' : '') + '">' + x[5] + '</div><div class="tg dash">—</div></div>'; }).join('') + '</div></div>' +
      '<div class="card"><div class="no">05 · AI CONFIDENCE</div><div class="lbl">PREDICTION QUALITY</div><div class="v" style="display:flex;align-items:flex-end;gap:8px;padding:8px 0 10px"><span class="big2">99.5</span><span style="font:400 18px var(--sans);color:var(--ink2);padding-bottom:6px">%</span></div><div class="pq" aria-hidden="true">' + [24, 30, 34, 36, 33, 36, 36, 30].map(function (k, i) { return '<i class="' + (i === 7 ? 'on' : '') + '" style="height:' + k + 'px"></i>'; }).join('') + '</div><div class="m3" style="padding-top:8px">LAST 8 CYCLES · MIN 98.7%</div></div></div>';
    return h;
  };

  /* ---------- montagem ---------- */
  function mount(id, o) {
    o = o || {}; closeFlow(true);
    S.screen = id; var shot = T[id](); app.innerHTML = shot;
    app.setAttribute('data-screen', id);
    jump.value = NAMES[id] ? id : 'home';
    try { history.replaceState(null, '', '#' + id); } catch (e) { /* ignorar */ }
    drawCharts();
    var sv = $('#sp-v'); if (sv) sv.textContent = f2(S.sp);
    if (o.focus !== false) { app.focus({ preventScroll: true }); window.scrollTo(0, 0); say('Screen: ' + (NAMES[id] || id)); }
  }
  function again() { mount(S.screen, { focus: false }); }

  function err(input, msg) {
    var old = input.parentElement.querySelector('.perr'); if (old) old.remove();
    input.removeAttribute('aria-invalid'); input.style.borderColor = ''; if (!msg) return;
    var d = document.createElement('div'); d.className = 'perr'; d.id = input.id + '-err'; d.textContent = msg;
    input.setAttribute('aria-invalid', 'true'); input.setAttribute('aria-describedby', d.id); input.style.borderColor = 'var(--danger)'; input.insertAdjacentElement('afterend', d);
  }

  var ACT = {
    start: function () { mount('home'); },
    change: function () { toast('Changing operator is outside this prototype.'); },
    out: function () { toast('This link is outside the prototype.'); },
    signin: function () {
      var em = $('#em'), pw = $('#pw'); err(em, ''); err(pw, '');
      if (!/^\S+@\S+\.\S+$/.test(em.value)) { err(em, 'Enter a valid e-mail, like name@company.com.'); em.focus(); return; }
      if (!pw.value) { err(pw, 'Enter your password.'); pw.focus(); return; }
      mount('home');
    },
    ai: function (t) { openFlow(S.ai === 'on' ? 1 : 3, t); },
    ack: function (t) { S.acked = true; t.textContent = '✓ Acknowledged'; t.setAttribute('aria-disabled', 'true'); t.style.opacity = '.7'; toast('Alarm acknowledged. It stays open until the setpoint changes.'); },
    opencirc: function () { mount('circuits'); },
    hrange: function (t) { S.hrange = t.getAttribute('data-v'); again(); },
    view: function (t) { S.view = t.getAttribute('data-v'); again(); },
    stage: function (t) {
      var c = t.getAttribute('data-c');
      if (/stockpile/i.test(c)) { toast('The stockpile is not supervised by the AI.'); return; }
      var map = { 'primary crushing': 'Crushing', crushing: 'Crushing', 'sag mill': 'SAG mill', 'ball mill': 'Ball mill', flotation: 'Flotation' };
      S.circ = map[c.toLowerCase()] || 'SAG mill'; S.drawer = S.circ === 'SAG mill' ? S.drawer : false; mount('parameters');
    },
    circ: function (t) { S.circ = t.getAttribute('data-c'); again(); },
    row: function () { S.drawer = true; again(); },
    close: function () { S.drawer = false; again(); },
    minus: function () { S.sp = Math.max(40, Math.round((S.sp - 0.5) * 100) / 100); $('#sp-v').textContent = f2(S.sp); },
    plus: function () { S.sp = Math.min(90, Math.round((S.sp + 0.5) * 100) / 100); $('#sp-v').textContent = f2(S.sp); },
    reject: function () { S.drawer = false; again(); toast('Recommendation rejected. The setpoint stays at 50.54.'); },
    apply: function () {
      if (R()) return;
      if (S.sp < 55 || S.sp > 65) { toast('Outside the control band (55 to 65). Adjust the value to apply.'); return; }
      S.resolved = true; S.acked = true; again(); toast('Setpoint ' + f2(S.sp) + ' applied. The alarm on Home is cleared (illustrative).'); say('Setpoint applied. Alarm cleared.');
    },
    range: function (t) { var v = t.getAttribute('data-v'); if (v !== '7 DAYS') { toast('This prototype has the 7-day series only.'); return; } },
    series: function (t) { var k = t.getAttribute('data-v'); if (S.series[k] && !S.series[other(k)]) { toast('Keep at least one series visible.'); return; } S.series[k] = !S.series[k]; again(); },
    marker: function (t) { S.ev = +t.getAttribute('data-ev'); again(); var e = $('.ev.hl'); if (e && e.scrollIntoView) e.scrollIntoView({ block: 'nearest' }); },
    ev: function (t) { S.ev = +t.getAttribute('data-ev'); again(); },
    csv: function () { toast('Export simulated. Nothing is downloaded in this prototype.'); },
    rep: function (t) { S.rep = +t.getAttribute('data-i'); again(); if (S.rep) toast('Only the Shift B draft has a full preview in this prototype.'); },
    rtype: function () { toast('This prototype shows the Shift reports.'); },
    tog: function (t) { t.setAttribute('aria-checked', t.getAttribute('aria-checked') === 'true' ? 'false' : 'true'); },
    newrep: function () { toast('New report draft created (illustrative).'); },
    pdf: function () { toast('PDF download simulated.'); },
    sign: function () { if (S.sent) return; S.sent = true; again(); toast('Shift handover signed and sent (illustrative).'); }
  };
  function other(k) { return k === 't' ? 'p' : 't'; }

  app.addEventListener('click', function (e) {
    var go = e.target.closest('[data-go]'); if (go) { mount(go.getAttribute('data-go')); return; }
    var a = e.target.closest('[data-act]'); if (!a || !ACT[a.getAttribute('data-act')]) return;
    e.preventDefault(); ACT[a.getAttribute('data-act')](a);
  });
  app.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { var g = e.target.closest('g[data-act],[role=button][data-act]'); if (g && g.tagName !== 'BUTTON') { e.preventDefault(); ACT[g.getAttribute('data-act')](g); return; } }
    if (e.key === 'Enter' && e.target.closest('[data-form]') && e.target.tagName === 'INPUT') { e.preventDefault(); ACT.signin(); }
  });
  app.addEventListener('input', function (e) { if (e.target.id === 'em' || e.target.id === 'pw') err(e.target, ''); });

  /* ---------- fluxo: desligar a IA ---------- */
  function closeFlow(silent) {
    if (flowCleanup) { flowCleanup(); flowCleanup = null; }
    if (ovEl) { ovEl.remove(); ovEl = null; document.body.style.overflow = ''; }
    document.removeEventListener('keydown', onFlowKey, true);
    if (!silent && lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  function onFlowKey(e) {
    if (!ovEl) return;
    if (e.key === 'Escape') { e.preventDefault(); var ab = $('[data-abort]', ovEl); if (ab) ab.click(); else closeFlow(); return; }
    if (e.key === 'Tab') {
      var f = $$('button,select', ovEl); if (!f.length) return; var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }
  function overlay(html, label, closeLabel) {
    if (ovEl) { ovEl.remove(); ovEl = null; } if (flowCleanup) { flowCleanup(); flowCleanup = null; }
    var ov = document.createElement('div'); ov.className = 'ov'; ov.lang = 'en';
    ov.innerHTML = '<div class="ovc" role="dialog" aria-modal="true" aria-label="' + label + '">' + html + '</div><button type="button" class="ovx">' + closeLabel + '</button>';
    $('.ovx', ov).addEventListener('click', function () { var ab = $('[data-abort]', ov); if (ab) ab.click(); else closeFlow(); });
    document.body.appendChild(ov); document.body.style.overflow = 'hidden'; ovEl = ov;
    document.addEventListener('keydown', onFlowKey, true); return $('.ovc', ov);
  }
  function openFlow(step, from) { lastFocus = from || document.activeElement; if (step === 1) flow1(); else flow3(); }
  function flow1() {
    var box = overlay('<div class="fc"><div class="st">STEP 1 · CONFIRM</div><div class="tt"><span aria-hidden="true">▲</span><h3>Turn off AI control?</h3></div>' +
      '<p>18 supervised parameters return to manual setpoints immediately. Expect throughput to drop toward the 7,710 t/h baseline within one cycle.</p>' +
      '<div class="box"><div>Setpoints handed to operator<span>18</span></div><div>Estimated production impact<span>−2.1%</span></div></div>' +
      '<div class="fl2"><label for="reason">Reason (recorded in the log)</label><select id="reason"><option value="">Select a reason…</option><option>Maintenance on feed belt BL4</option><option>Sensor fault</option><option>Process upset</option><option>Other</option></select><div id="reason-err" class="perr" style="min-height:0"></div></div>' +
      '<div class="acts"><button type="button" class="btn-g" data-cancel="1">Cancel</button><button type="button" class="btn-d" id="hold" aria-describedby="hold-help"><span class="hbarf"></span><span class="hlbl">Hold to confirm</span></button></div>' +
      '<div class="hh2" id="hold-help">Press and hold for about one second. Keyboard: hold Space or Enter.</div></div>', 'Turn off AI control, step 1 of 3, confirm', 'Close');
    var hold = $('#hold', box), sel = $('#reason', box), msg = $('#reason-err', box), bar = $('.hbarf', box);
    $('[data-cancel]', box).addEventListener('click', function () { closeFlow(); });
    sel.addEventListener('change', function () { msg.textContent = ''; sel.removeAttribute('aria-invalid'); });
    var dur = 1200, raf = null, t0 = 0, holding = false;
    function reset() { holding = false; cancelAnimationFrame(raf); bar.style.width = '0'; }
    function start() {
      if (holding) return;
      if (!sel.value) { msg.textContent = 'Select a reason to continue.'; sel.setAttribute('aria-invalid', 'true'); sel.setAttribute('aria-describedby', 'reason-err'); sel.focus(); return; }
      holding = true; t0 = performance.now();
      (function tick(now) { var k = Math.min(1, ((now || performance.now()) - t0) / dur); bar.style.width = (k * 100) + '%'; if (k >= 1) { S.reason = sel.value; holding = false; flow2(); return; } raf = requestAnimationFrame(tick); })(t0);
    }
    hold.addEventListener('pointerdown', function (e) { e.preventDefault(); start(); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { hold.addEventListener(ev, reset); });
    hold.addEventListener('keydown', function (e) { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); start(); } });
    hold.addEventListener('keyup', function (e) { if (e.key === ' ' || e.key === 'Enter') reset(); });
    flowCleanup = reset; sel.focus(); say('Turn off AI control. Step 1 of 3. Choose a reason, then hold to confirm.');
  }
  function flow2() {
    if (flowCleanup) { flowCleanup(); flowCleanup = null; }
    var box = overlay('<div class="fc"><div class="st">STEP 2 · HANDOVER IN PROGRESS</div><h3>Returning control</h3><div class="cnt" id="cnt">11 OF 18 PARAMETERS HANDED OVER</div><div class="prog" aria-hidden="true"><i id="fill" style="width:61%"></i></div>' +
      '<div><div class="hrow2">SAG_Velocidade<b>✓ manual</b></div><div class="hrow2">SAG_Celula_Carga<b>✓ manual</b></div><div class="hrow2 p">SAG_Potencia<span id="r3">handing over…</span></div><div class="hrow2 q">Throughput_Alimentacao<span id="r4">queued</span></div></div>' +
      '<div class="acts"><button type="button" class="btn-g" data-abort="1">Abort and keep AI on</button></div></div>', 'Turn off AI control, step 2 of 3, handover in progress', 'Close');
    var n = 0, cnt = $('#cnt', box), fill = $('#fill', box), r3 = $('#r3', box), r4 = $('#r4', box), ab = $('[data-abort]', box);
    var timer = setInterval(function () {
      n++; cnt.textContent = n + ' OF 18 PARAMETERS HANDED OVER'; fill.style.width = (n / 18 * 100) + '%';
      r3.textContent = n >= 14 ? '✓ manual' : 'handing over…'; r4.textContent = n >= 18 ? '✓ manual' : (n >= 14 ? 'handing over…' : 'queued');
      if (n >= 18) { clearInterval(timer); flowCleanup = null; S.ai = 'off'; say('Handover complete. AI control is off.'); flow3(true); }
    }, 220);
    flowCleanup = function () { clearInterval(timer); };
    ab.addEventListener('click', function () { clearInterval(timer); flowCleanup = null; closeFlow(); toast('Handover aborted. AI control stays on.'); });
    ab.focus(); say('Handover in progress. Step 2 of 3.');
  }
  function flow3(fromFlow) {
    if (fromFlow) again();
    var box = overlay('<div class="fc"><div class="st">STEP 3 · MANUAL MODE HOME</div><div class="manual"><b aria-hidden="true">▲</b><div><b>AI CONTROL OFF · manual since 14:52</b><span>Reason: ' + (S.reason ? S.reason.charAt(0).toLowerCase() + S.reason.slice(1) : 'maintenance on feed belt BL4') + '</span></div></div>' +
      '<div class="m2c"><div><div class="k">THROUGHPUT</div><div class="v">371 <span>t/h</span></div><div class="e">↓ −2.4% since manual</div></div><div><div class="k">PREDICTION</div><div class="v">—</div><div class="m3">UNAVAILABLE IN MANUAL</div></div></div>' +
      '<p>Prediction widgets go to an explicit unavailable state instead of showing a stale number — the failure mode most likely to mislead an operator mid-shift.</p>' +
      '<div class="foot"><span>Resume when maintenance ends</span><button type="button" class="btn-p" id="back">Turn AI back on</button></div></div>', 'Turn off AI control, step 3 of 3, manual mode', 'Continue in manual mode');
    var back = $('#back', box);
    back.addEventListener('click', function () { S.ai = 'on'; closeFlow(true); again(); toast('AI control resumed. 18 parameters are supervised again.'); });
    back.focus(); say('Manual mode. Step 3 of 3.');
  }

  /* ---------- barra do protótipo ---------- */
  jump.addEventListener('change', function () { var v = jump.value; if (v === 'flow') { mount('home'); openFlow(1); jump.value = 'flow'; } else mount(v); });
  $$('input[name="tema"]').forEach(function (r) { r.addEventListener('change', function () { setTheme(r.value); }); });
  $('#reset').addEventListener('click', function () {
    S.ai = 'on'; S.resolved = false; S.acked = false; S.sp = 58.0; S.drawer = true; S.dInit = undefined; S.circ = 'SAG mill'; S.sent = false; S.ev = -1; S.rep = 0; S.series = { t: true, p: true };
    mount('login-badge'); toast('Prototype restarted.');
  });
  var pb = $('#pbar'); if (pb && window.innerWidth >= 720) pb.setAttribute('open', '');
  var rt = null, lastW = 0;
  function onSize() { var w = app.clientWidth; if (Math.abs(w - lastW) < 2) return; lastW = w; clearTimeout(rt); rt = setTimeout(drawCharts, 60); }
  if (window.ResizeObserver) new ResizeObserver(onSize).observe(app); else window.addEventListener('resize', onSize);

  setTheme('claro');
  var st = (location.hash || '').replace('#', '');
  mount(NAMES[st] ? st : 'login-badge', { focus: false });
})();
</script>
</body>
</html>
