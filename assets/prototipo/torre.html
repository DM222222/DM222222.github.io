<!DOCTYPE html>
<html lang="pt-BR" data-theme="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torre de Controle — protótipo navegável</title>
<meta name="robots" content="noindex">
<meta name="description" content="Protótipo navegável da Torre de Controle: monitoramento operacional com IA, com dados fictícios.">
<link rel="icon" href="../logo-dm.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<style>:root{--bg:#F1F4F7;--surface:#FFFFFF;--s2:#EBEEF2;--ink:#12161C;--ink2:#3A4450;--ink3:#566170;--line:#D3D9E0;--field:#6E7A89;--accent:#0B6E78;--accentSoft:#E1F1F2;--onAccent:#FFFFFF;--crit:#B42318;--critBg:#FDEBE9;--warn:#7A4A00;--warnBg:#FFF1D0;--ok:#17703A;--okBg:#E3F3E8;--info:#1F5FA8;--infoBg:#E6EFFA;--c2:#5F6E82;--c3:#7A98A6;--shadow:0 1px 2px rgba(18,22,28,.05),0 4px 14px rgba(18,22,28,.04);--r:14px;color-scheme:light}
[data-theme="escuro"]{--bg:#0B0F14;--surface:#141A22;--s2:#1D2530;--ink:#E8ECF1;--ink2:#B9C2CD;--ink3:#97A3B1;--line:#2C3743;--field:#7B8796;--accent:#4DBFCB;--accentSoft:#12303A;--onAccent:#04252A;--crit:#FF9087;--critBg:#3A1B19;--warn:#F3BC52;--warnBg:#33260C;--ok:#74D393;--okBg:#12301C;--info:#8BBBF2;--infoBg:#14263D;--c2:#8C9BB0;--c3:#5E8795;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 'Inter Tight',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:var(--bg);padding:.6rem .9rem;border-radius:8px;z-index:200}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* botoes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--field);background:var(--surface);font-weight:500;font-size:.92rem;text-decoration:none}
.btn:hover{background:var(--s2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--s2)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.84rem}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;border:1px solid transparent;background:transparent;position:relative}
.ibtn:hover{background:var(--s2)}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--crit);color:var(--surface);font-size:.7rem;font-weight:600;display:flex;align-items:center;justify-content:center}
[data-theme="escuro"] .badge{color:#1b0b0a}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 20% 0%,var(--accentSoft),transparent 60%),var(--bg)}
.lcard{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--onAccent);display:flex;align-items:center;justify-content:center}
.mark svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand b{display:block;font-size:1.05rem;line-height:1.2}
.brand span{font-size:.82rem;color:var(--ink3)}
.lcard h1{font-size:1.4rem;margin:22px 0 4px}
.lcard .lead{color:var(--ink2);font-size:.92rem;margin-bottom:18px}
.f{margin-bottom:14px}
.f label{display:block;font-size:.85rem;font-weight:500;margin-bottom:6px}
.f .in{display:flex;border:1px solid var(--field);border-radius:10px;background:var(--surface)}
.f input{flex:1;min-width:0;min-height:44px;padding:0 12px;border:0;background:transparent;border-radius:10px}
.f .in:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.f input:focus-visible{outline:none}
.f .in.bad{border-color:var(--crit)}
.f .err{color:var(--crit);font-size:.82rem;margin-top:6px}
.f .eye{border:0;background:transparent;padding:0 12px;font-size:.82rem;color:var(--ink2);border-radius:10px;min-width:64px}
.lcard .btn{width:100%}
.lcard .or{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:.8rem;margin:14px 0}
.lcard .or:before,.lcard .or:after{content:"";flex:1;height:1px;background:var(--line)}
.note{font-size:.8rem;color:var(--ink3);margin-top:16px}

/* casca: ocupa a altura da janela */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:8px;height:56px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);z-index:40}
.top .brand{margin-right:auto}
.top .brand .mark{width:30px;height:30px}
.top .brand b{font-size:.98rem}
.burger{display:none}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--s2);gap:2px}
.seg button{min-height:34px;padding:0 13px;border:0;border-radius:8px;background:transparent;font-size:.83rem;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
[data-theme="escuro"] .seg button[aria-pressed="true"]{background:var(--accent);color:var(--onAccent);box-shadow:none}
.per{display:flex;align-items:center;gap:10px}
.per small{color:var(--ink3);font-size:.76rem;max-width:190px;line-height:1.2}
.shell{flex:1;min-height:0;display:flex}
.side{width:216px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto;transition:width .18s}
.side .grp{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:12px 12px 4px}
.side .nv{display:flex;align-items:center;gap:12px;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:transparent;text-align:left;width:100%;color:var(--ink2);font-weight:500;position:relative}
.side .nv:hover{background:var(--s2)}
.side .nv[aria-current="page"]{background:var(--accent);color:var(--onAccent)}
.side .nv svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .nv .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--crit);color:var(--surface);font-size:.72rem;font-weight:600;display:flex;align-items:center;justify-content:center}
[data-theme="escuro"] .side .nv .cnt{color:#1b0b0a}
.side .col{margin-top:auto;display:flex}
.side .col .nv{color:var(--ink3)}
.shell.mini .side{width:64px}
.shell.mini .side .lb,.shell.mini .side .grp,.shell.mini .side .cnt{display:none}
.shell.mini .side .nv{justify-content:center;padding:0}
.shell.mini .side .col .nv svg{transform:rotate(180deg)}
.main{flex:1;min-width:0;overflow:auto;padding:14px 18px 18px}
.main:focus{outline:none}
.pg{min-height:100%;display:flex;flex-direction:column;gap:12px}
.ph{flex:none;display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.ph h1{font-size:1.35rem;line-height:1.2;letter-spacing:-.01em}
.ph h1:focus{outline:none}
.sub{color:var(--ink2);font-size:.88rem}

/* grade de 60 colunas: 1/3=20, 1/4=15, 1/5=12, 1/2=30 */
.dash{display:grid;grid-template-columns:repeat(60,minmax(0,1fr));gap:12px;flex:1;min-height:0;grid-auto-rows:auto}
.dash>.card:has(.ch),.dash>.card:has(.hb),.dash>.card:has(.dv),.dash>.card:has(.dn){min-height:270px}
.dash>*{grid-column:span var(--s,60);min-width:0}
@media (min-width:1280px) and (min-height:660px){.pg{height:100%}.dash{grid-template-rows:var(--rows)}.dash>.card:has(.ch),.dash>.card:has(.hb),.dash>.card:has(.dv),.dash>.card:has(.dn){min-height:0}}
@media (max-width:1279px){.dash>*{grid-column:span var(--t,var(--s,60))}}
@media (max-width:820px){.dash>*{grid-column:span var(--m,60)}}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;min-width:0}
.card h2{font-size:.95rem;font-weight:600;line-height:1.25}
.card .cs{color:var(--ink3);font-size:.78rem;margin-top:1px}
.card .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;flex:none}
.cb{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px}
.ch{flex:1;min-height:130px;position:relative}
.ch svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ch text{fill:var(--ink3);font-size:11px;font-family:inherit}
.ch .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.ch .vl{fill:var(--ink);font-size:11px;font-weight:600}
.ch .ref{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:5 4}
.ch .reft{fill:var(--ink2);font-size:11px;font-weight:500}
.ch rect.b:hover{opacity:.82}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.76rem;color:var(--ink2);flex:none}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg .mkl{display:inline-block;width:2px;height:12px;background:var(--ink2);margin-right:6px;vertical-align:-2px}

/* indicadores */
.st{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st.crit{background:var(--critBg);color:var(--crit)}
.st.warn{background:var(--warnBg);color:var(--warn)}
.st.ok{background:var(--okBg);color:var(--ok)}
.st.info{background:var(--infoBg);color:var(--info)}
.st.mut{background:var(--s2);color:var(--ink2)}
.tx-ok{color:var(--ok)}.tx-crit{color:var(--crit)}.tx-warn{color:var(--warn)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .kh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .l{font-size:.78rem;color:var(--ink3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kpi .v{font-size:1.6rem;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.kpi .d{font-size:.76rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sp{width:100%;height:26px;margin-top:4px;display:block}
.big{font-size:2rem;font-weight:600;letter-spacing:-.02em;line-height:1.1}

/* decisao */
.dc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c2);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.dc.crit{border-left-color:var(--crit)}.dc.warn{border-left-color:var(--warn)}
.dc .t{font-weight:600;font-size:.92rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dc .r{font-size:.8rem;color:var(--ink2);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dc .r b{color:var(--ink)}
.dc .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.dc .ft span{font-size:.74rem;color:var(--ink3)}
.dc.none{border-left-color:var(--ok);flex-direction:row;align-items:center;gap:12px}

/* barras horizontais */
.hb{display:flex;flex-direction:column;justify-content:space-around;gap:8px;flex:1;min-height:0}
.hr{display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:10px;font-size:.84rem}
.hr .n{font-weight:500}
.tr{position:relative;height:12px;border-radius:6px;background:var(--s2)}
.fl{height:100%;border-radius:6px;background:var(--c3)}
.fl.crit{background:var(--crit)}.fl.warn{background:var(--warn)}.fl.ok{background:var(--accent)}.fl.mut{background:var(--c2)}
.mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.hr .vv{text-align:right;display:flex;justify-content:flex-end;align-items:center;gap:6px;white-space:nowrap}
.stk{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--s2)}
.stk span{display:block;height:100%}
@container (max-width:380px){.hr{grid-template-columns:58px 1fr auto;gap:8px}.hr .vv{font-size:.78rem}}
.card{container-type:inline-size}

/* divergencia */
.dv{display:flex;flex-direction:column;justify-content:space-around;gap:8px;flex:1}
.dvr{display:grid;grid-template-columns:48px 1fr 104px;white-space:nowrap;align-items:center;gap:10px;font-size:.84rem}
.dvt{position:relative;height:16px}
.dvt:before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink2)}
.dvt i{position:absolute;top:2px;height:12px;border-radius:3px}
.dvt i.pos{left:50%;background:var(--warn)}
.dvt i.neg{right:50%;background:var(--info)}
.dvt i.ok{background:var(--accent)}

/* anel */
.fc{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:14px 10px}
.fc .nm{display:flex;align-items:center;gap:8px;font-weight:600}
.fc svg.ring{width:92px;height:92px}
.fc .rg{display:grid;gap:4px;width:100%;font-size:.8rem;text-align:left}
.fc .rg div{display:flex;justify-content:space-between;gap:6px;align-items:center}
.fc .rg span:first-child{color:var(--ink3)}
.rt{font-size:15px;font-weight:600;fill:var(--ink)}
.rs{font-size:8px;fill:var(--ink3)}

/* mapa de calor, tabelas */
.hm{width:100%;border-collapse:separate;border-spacing:4px;font-size:.84rem;flex:1}
.hm th{color:var(--ink3);font-weight:500;font-size:.76rem;text-align:center}
.hm th:first-child{text-align:left}
.hm td{text-align:center;border-radius:8px;padding:6px 4px;font-weight:600;color:var(--ink)}
.hm td.rowh{text-align:left;background:transparent;font-weight:500}
.tb{width:100%;border-collapse:collapse;font-size:.84rem}
.tb th,.tb td{padding:7px 6px;border-top:1px solid var(--line);text-align:right}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb thead th{border-top:0;color:var(--ink3);font-weight:500;font-size:.76rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.76rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.bad{border-color:var(--warn);color:var(--warn);background:var(--warnBg);font-weight:600}
.seg2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:.78rem}
.seg2 div{display:flex;flex-direction:column;gap:2px}
.seg2 b{font-size:1.05rem}
.seg2 i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.sel{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink2)}
.sel select{min-height:40px;padding:0 10px;border:1px solid var(--field);border-radius:8px;background:var(--surface)}
.dn{display:flex;align-items:center;gap:18px;flex:1;min-height:0}
.dn svg{width:min(150px,36cqw);aspect-ratio:1;flex:none}
.dn .ctr{font-size:19px;font-weight:600;fill:var(--ink)}
.dn .cts{font-size:9px;fill:var(--ink3)}
.dl{flex:1;min-width:0;display:grid;gap:7px;font-size:.84rem}
.dl div{display:flex;align-items:center;gap:8px}
.dl i{width:10px;height:10px;border-radius:3px;flex:none}
.dl .p{margin-left:auto;font-weight:600;white-space:nowrap}
.dl small{color:var(--ink3);font-size:.74rem}

/* alertas: lista + detalhe */
.tabs{display:flex;flex-wrap:wrap;gap:3px;padding:3px;background:var(--s2);border-radius:11px;flex:none}
.tabs button{flex:1 1 auto;min-height:36px;padding:0 8px;border:0;border-radius:8px;background:transparent;font-weight:500;font-size:.82rem;color:var(--ink2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
[data-theme="escuro"] .tabs button[aria-selected="true"]{background:var(--accent);color:var(--onAccent);box-shadow:none}
.al{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c2);border-radius:12px;margin-bottom:8px;width:100%;text-align:left}
.al.crit{border-left-color:var(--crit)}.al.warn{border-left-color:var(--warn)}.al.info{border-left-color:var(--info)}.al.done{opacity:.8}
.al[aria-current="true"]{background:var(--accentSoft);border-color:var(--accent);border-left-color:inherit}
.al .tt{flex:1;min-width:0}
.al .tt b{display:block;font-weight:600;font-size:.9rem;line-height:1.3;margin-top:4px}
.al .mt{font-size:.76rem;color:var(--ink3)}
.al p{color:var(--ink2);font-size:.84rem;margin:2px 0 4px}
.list{flex:1;min-height:0;overflow:auto;padding-right:2px;margin-top:10px}
.sumr{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dt{display:flex;flex-direction:column;min-height:0;flex:1;overflow:auto;gap:14px}
.dt h2{font-size:1.1rem;margin-top:8px;line-height:1.3}
.dt .df{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}

/* camadas: detalhe (celular), insights */
.ov{position:fixed;inset:0;background:rgba(8,12,18,.55);z-index:90;display:flex;justify-content:flex-end}
.ov.mid{justify-content:center;align-items:center;padding:16px}
.dw{width:min(520px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
.dw .dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 12px;position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line)}
.dw .dh h2{font-size:1.15rem;line-height:1.3}
.dw .db{padding:16px 20px;display:grid;gap:16px}
.dw .df{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;flex-wrap:wrap}
.blk h3{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px;font-weight:600}
.blk p{font-size:.9rem}
.recbox{border:1px solid var(--accent);border-radius:12px;padding:12px 14px;background:var(--accentSoft)}
.recbox b{display:block;margin-bottom:3px}
.ba{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 14px;align-items:center;font-size:.88rem;margin-top:10px}
.ba .h{color:var(--ink3);font-size:.74rem}
.cf{border:1px solid var(--warn);background:var(--warnBg);color:var(--ink);border-radius:12px;padding:12px 14px}
.dn2{border:1px solid var(--ok);background:var(--okBg);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.empty{padding:22px 16px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.mdl{width:min(640px,100%);max-height:90vh;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.mdl .dh{padding:18px 20px 10px;display:flex;justify-content:space-between;gap:12px}
.mdl .tabs{margin:0 20px 10px}
.mdl .db{padding:0 20px 20px;overflow:auto;display:grid;gap:10px}
.ins{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ins .r{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}

.pop .ph2{padding:8px 10px;font-weight:600}
.pop .it{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:10px;min-height:44px}

.pop .it small{display:block;color:var(--ink3);font-size:.78rem}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.pop .th{display:flex;gap:8px;padding:6px 10px;align-items:center;justify-content:space-between;font-size:.88rem}

.chat{position:fixed;right:18px;bottom:18px;z-index:70}
.fab{width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--onAccent);box-shadow:0 6px 20px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cp{width:min(380px,calc(100vw - 24px));height:min(560px,calc(100vh - 100px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:1280px){.chat.open{position:static;flex:none;width:340px}.chat.open .cp{width:100%;height:100%;border-radius:0;border-width:0 0 0 1px;box-shadow:none}}
.cp .ch2{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.cp .ch2 b{display:block}.cp .ch2 span{font-size:.76rem;color:var(--ink3)}
.cm{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:90%;padding:9px 12px;border-radius:12px;font-size:.88rem}
.msg.bot{background:var(--s2);align-self:flex-start}
.msg.me{background:var(--accent);color:var(--onAccent);align-self:flex-end}
.msg button.lk{display:block;margin-top:8px;border:1px solid var(--field);background:var(--surface);border-radius:8px;padding:6px 10px;min-height:36px;font-size:.8rem}
.sg{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.sg button{border:1px solid var(--field);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.8rem;min-height:34px}
.sg button:hover{background:var(--s2)}
.cf2{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}

.cf2 .btn{padding:0 14px}

  if (k === 'ask') { S.confirm = id; refreshDetail('[data-act="apply"]'); }
  else if (k === 'cancel') { S.confirm = null; refreshDetail('[data-act="ask"]'); }
  else if (k === 'apply') { const a = AL[id]; setSt(id, id === 'a-inad' ? 'encaminhado' : 'resolvido', a.rec.done + '. Indicadores atualizados.'); }
  else if (k === 'snooze') setSt(id, 'adiado', 'Alerta adiado por 4 horas.');
  else if (k === 'dismiss') setSt(id, 'dispensado', 'Alerta dispensado.');
  else if (k === 'read') setSt(id, 'lido', 'Marcado como lido.');
  else if (k === 'undo') setSt(id, 'aberto', 'Ação desfeita. O alerta voltou a aberto.');
  else if (k === 'reset') { ALIST.forEach(a => { a.st = 'aberto'; a.at = ''; }); S.msgs = []; S.acur = null; S.atab = 'todos'; closePop(); closeLayer(); render(false); toast('Demonstração reiniciada.'); }
  else if (k === 'logout') { closePop(); closeLayer(); S.auth = false; $('#app').hidden = true; $('#login').hidden = false; $('#lu').focus(); }
}

/* ---------- chat Chronus AI ---------- */
function answer(q) {
  const t = q.toLowerCase(), m = t.match(/cd ?([1-5])/), l = needAct();
  if (m) { const i = +m[1] - 1, o = occSt(occ(i)), s = slaSt(sla(i)); return { x: CDS[i] + ': ocupação ' + pct(occ(i), 0) + ' (' + o[1].slice(2) + '), SLA ' + pct(sla(i)) + ' (' + s[1].slice(2) + '), TFA ' + pct(B.tfa[i]) + ' e faturamento de ' + money(B.fat[i]) + ' em 12 meses.', go: CDAL[i] && isOpen(AL[CDAL[i]]) ? CDAL[i] : null }; }
  if (/decis|urgen|priorid|exige|preciso fazer|pendente|alerta/.test(t)) return l.length ? { x: l.length + ' item(ns) pedem sua decisão:\n' + l.map(a => '• ' + a.title).join('\n'), go: l[0].id } : { x: 'Nada exige sua decisão agora. Os alertas críticos e de atenção foram tratados.' };
  if (/pior|cr[ií]tic|problema|risco/.test(t)) { const w = CDS.map((_, i) => i).sort((a, b) => sla(a) - sla(b))[0]; return { x: 'O ' + CDS[w] + ' tem o menor SLA: ' + pct(sla(w)) + ' (meta ' + META_SLA + '%), com ocupação de ' + pct(occ(w), 0) + '.', go: CDAL[w] && isOpen(AL[CDAL[w]]) ? CDAL[w] : null }; }
  if (/sla/.test(t)) return { x: 'SLA global: ' + pct(slaG()) + ' (meta ' + META_SLA + '%).\n' + CDS.map((c, i) => c + ': ' + pct(sla(i))).join(' · ') };
  if (/ocupa|capacidade/.test(t)) return { x: 'Ocupação média ponderada: ' + pct(occG(), 0) + '.\n' + CDS.map((c, i) => c + ': ' + pct(occ(i), 0)).join(' · ') + '\nLimite operacional: ' + LIM_OCC + '%.' };
  if (/caixa|receb|pagar/.test(t)) return { x: 'Em 12 meses: a receber ' + money(REC12) + ' e a pagar ' + money(PAG12) + ', resultado de +' + money(REC12 - PAG12) + '. Em outubro: ' + money(SER.rec.mes[11]) + ' a receber contra ' + money(SER.pag.mes[11]) + ' a pagar.' };
  if (/inadimpl/.test(t)) return { x: 'Inadimplência global: ' + pct(SER.inad.mes[11]) + ' (meta abaixo de 3%). O Marketplace está em 3,8%, acima da meta.', go: isOpen(AL['a-inad']) ? 'a-inad' : null };
  if (/fatur|receita/.test(t)) return { x: 'Faturamento de ' + money(FAT12) + ' em 12 meses. Outubro: ' + money(SER.fat.mes[11]) + ', ' + pct(FAT_DELTA) + ' acima de setembro. Os CDs 1 e 2 concentram 62,5%.' };
  if (/custo/.test(t)) return { x: 'Custo operacional do mês: ' + money(CUSTO) + ', dentro do orçamento de ' + money(ORC) + '.' };
  if (/funil|venda|convers/.test(t)) return { x: 'De 100 leads, 25 viram clientes (25%). A maior perda está entre proposta e cliente: metade não avança.' };
  if (/score|carteira|cliente/.test(t)) return { x: 'Score médio da carteira: ' + nf(SCORE, 0) + ' em ' + CLI + ' clientes ativos. O Marketplace tem o menor score (68).' };
  if (/resum|semana|geral|situa|como estamos/.test(t)) return { x: 'Resumo: faturamento de ' + money(FAT12) + ' em 12 meses, SLA global ' + pct(slaG()) + ', inadimplência ' + pct(SER.inad.mes[11]) + '. ' + (l.length ? l.length + ' item(ns) pedem decisão.' : 'Nada pede decisão agora.'), go: l[0] && l[0].id };
  return { x: 'Ainda não sei responder isso com os dados do painel. Posso falar de decisões pendentes, SLA, ocupação, caixa, inadimplência, faturamento, custo, vendas, score e de cada CD (ex.: "como está o CD 3?").' };
}
function renderChat() {
  const c = $('#chat'); c.className = 'chat' + (S.chatOpen ? ' open' : '');
  if (!S.chatOpen) { c.innerHTML = '<button class="fab" id="fab" aria-label="Abrir o assistente Chronus AI">' + svgi('chat') + '</button>'; setTimeout(drawCharts, 0); return; }
  c.innerHTML = '<div class="cp" role="dialog" aria-label="Chronus AI, assistente"><div class="ch2"><div><b>Chronus AI</b><span>Responde com os dados deste painel</span></div><button class="ibtn" id="cclose" aria-label="Fechar o assistente">✕</button></div><div class="cm" id="cm" role="log" aria-live="polite">' +
    '<div class="msg bot">Olá! Sou o Chronus AI. Pergunte sobre o que exige decisão, SLA, ocupação, caixa ou qualquer CD.</div>' +
    S.msgs.map(m => '<div class="msg ' + m.r + '">' + esc(m.x).replace(/\n/g, '<br>') + (m.go ? '<button class="lk" data-alert="' + m.go + '">Abrir o alerta</button>' : '') + '</div>').join('') + '</div>' +
    '<div class="sg">' + ['O que exige minha decisão?', 'Qual CD está pior?', 'Como está o caixa?', 'Resuma a situação'].map(q => '<button data-q="' + q + '">' + q + '</button>').join('') + '</div>' +
    '<form class="cf2" id="cform"><label class="sr" for="cin">Mensagem</label><input id="cin" placeholder="Digite sua pergunta" autocomplete="off"><button class="btn pri" type="submit">Enviar</button></form></div>';
  const m = $('#cm'); m.scrollTop = m.scrollHeight; $('#cin').focus(); setTimeout(drawCharts, 0);
}
function ask(q) { q = q.trim(); if (!q) return; S.msgs.push({ r: 'me', x: q }); renderChat(); setTimeout(() => { const a = answer(q); S.msgs.push({ r: 'bot', x: a.x, go: a.go }); renderChat(); }, 350); }

/* ---------- login ---------- */
function enter() { S.auth = true; $('#login').hidden = true; $('#app').hidden = false; $('#chat').hidden = false; renderChat(); watch(); const v = (location.hash.match(/#\/(\w+)/) || [])[1]; go(VIEWS[v] ? v : 'estrategico', false); }
$('#lform').addEventListener('submit', e => {
  e.preventDefault(); let bad = null;
  [['lu', 'lu-e', 'lu-w'], ['lp', 'lp-e', 'lp-w']].forEach(k => { const empty = !$('#' + k[0]).value.trim(); $('#' + k[1]).hidden = !empty; $('#' + k[2]).classList.toggle('bad', empty); $('#' + k[0]).setAttribute('aria-invalid', empty); if (empty && !bad) bad = k[0]; });
  if (bad) $('#' + bad).focus(); else enter();
});
$('#demo').addEventListener('click', enter);
$('#eye').addEventListener('click', e => { const i = $('#lp'), s = i.type === 'password'; i.type = s ? 'text' : 'password'; e.currentTarget.textContent = s ? 'Ocultar' : 'Mostrar'; e.currentTarget.setAttribute('aria-pressed', s); });

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-go],[data-alert]'); const p = $('#pop');
  if (!p.hidden && !e.target.closest('#pop') && !e.target.closest('#bell') && !e.target.closest('#avb')) closePop();
  if (e.target.id === 'ov') { closeLayer(); return; }
  if (!t) return;
  if (t.dataset.close !== undefined) closeLayer();
  else if (t.dataset.go) { const d = t.dataset.go; if (S.layer) closeLayer(); go(d); }
  else if (t.dataset.alert) showAlert(t.dataset.alert, t.closest('#pop') || t.closest('.msg') ? $('#bell') : t);
  else if (t.dataset.act) act(t.dataset.act, t.dataset.id);
  else if (t.dataset.period) { S.per = t.dataset.period; render(false); const b = $('[data-period="' + S.per + '"]'); if (b) b.focus(); $('#live').textContent = 'Período: ' + PER[S.per].n; }
  else if (t.dataset.tab) { S.atab = t.dataset.tab; render(false); const b = $('[data-tab="' + S.atab + '"]'); if (b) b.focus(); }
  else if (t.dataset.itab) { S.itab = t.dataset.itab; $('#ov').innerHTML = insightsHTML(); const b = $('[data-itab="' + S.itab + '"]'); if (b) b.focus(); }
  else if (t.dataset.themeSet) { setTheme(t.dataset.themeSet); $$('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeSet === S.theme)); }
  else if (t.dataset.q) ask(t.dataset.q);
  else if (t.id === 'bell') openPop('bell', t);
  else if (t.id === 'avb') openPop('acc', t);
  else if (t.id === 'insb') { S.itab = 'todos'; openLayer(insightsHTML(), true, t); }
  else if (t.id === 'colb') { S.mini = !S.mini; renderSide(); $('#colb').focus(); setTimeout(drawCharts, 220); }
  else if (t.id === 'burger') { const o = $('#shell').classList.toggle('open'); $('#scrim').classList.toggle('on', o); t.setAttribute('aria-expanded', o); }
  else if (t.id === 'fab') { S.chatOpen = true; renderChat(); }
  else if (t.id === 'cclose') { S.chatOpen = false; renderChat(); $('#fab').focus(); }
});
$('#scrim').addEventListener('click', () => { $('#shell').classList.remove('open'); $('#scrim').classList.remove('on'); $('#burger').setAttribute('aria-expanded', 'false'); });
document.addEventListener('submit', e => { if (e.target.id === 'cform') { e.preventDefault(); ask($('#cin').value); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.layer) closeLayer(); else if (!$('#pop').hidden) { closePop(); $('#bell').focus(); } else if (S.chatOpen) { S.chatOpen = false; renderChat(); $('#fab').focus(); } }
  else if (e.key === 'Tab' && S.layer) { const f = $$('button,[href],input,select', $('#ov')); if (!f.length) return; const a = f[0], z = f[f.length - 1]; if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); } }
  else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.getAttribute && e.target.getAttribute('role') === 'tab') { const tabs = $$('[role="tab"]', e.target.parentNode), i = tabs.indexOf(e.target), n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length]; n.click(); const sel = $('[role="tab"][aria-selected="true"]', $('#ov') || document); if (sel) sel.focus(); }
});
window.addEventListener('hashchange', () => { if (!S.auth) return; const v = (location.hash.match(/#\/(\w+)/) || [])[1]; if (v && v !== S.view) go(v, false); });
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) setTheme('escuro');
window.__torre = { S: S, AL: AL, go: go, enter: enter };
})();
</script>
