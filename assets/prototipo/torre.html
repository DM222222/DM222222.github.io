<!DOCTYPE html>
<html lang="pt-BR" data-theme="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torre de Controle — protótipo navegável</title>
<meta name="robots" content="noindex">
<meta name="description" content="Protótipo navegável da Torre de Controle: monitoramento operacional com IA, com dados fictícios.">
<link rel="icon" href="../logo-dm.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<style>:root{--bg:#F4F6F8;--surface:#FFFFFF;--s2:#EBEEF2;--ink:#12161C;--ink2:#3A4450;--ink3:#566170;--line:#CBD2DA;--field:#6E7A89;--accent:#0B6E78;--onAccent:#FFFFFF;--crit:#B42318;--critBg:#FDEBE9;--warn:#7A4A00;--warnBg:#FFF1D0;--ok:#17703A;--okBg:#E3F3E8;--info:#1F5FA8;--infoBg:#E6EFFA;--c2:#5F6E82;--c3:#7A98A6;--shadow:0 1px 2px rgba(18,22,28,.06);--r:12px;color-scheme:light}
[data-theme="escuro"]{--bg:#0D1117;--surface:#151B23;--s2:#1D2530;--ink:#E8ECF1;--ink2:#B9C2CD;--ink3:#97A3B1;--line:#38424F;--field:#7B8796;--accent:#4DBFCB;--onAccent:#04252A;--crit:#FF9087;--critBg:#3A1B19;--warn:#F3BC52;--warnBg:#33260C;--ok:#74D393;--okBg:#12301C;--info:#8BBBF2;--infoBg:#14263D;--c2:#8C9BB0;--c3:#5E8795;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 'Inter Tight',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:var(--bg);padding:.6rem .9rem;border-radius:8px;z-index:200}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* botoes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--field);background:var(--surface);font-weight:500;font-size:.92rem;text-decoration:none}
.btn:hover{background:var(--s2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--s2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85rem}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;border:1px solid transparent;background:transparent;position:relative}
.ibtn:hover{background:var(--s2)}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--crit);color:var(--surface);font-size:.7rem;font-weight:600;display:flex;align-items:center;justify-content:center}
[data-theme="escuro"] .badge{color:#1b0b0a}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--bg),var(--s2))}
.lcard{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--onAccent);display:flex;align-items:center;justify-content:center}
.mark svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand b{display:block;font-size:1.05rem;line-height:1.2}
.brand span{font-size:.82rem;color:var(--ink3)}
.lcard h1{font-size:1.35rem;margin:22px 0 4px}
.lcard .lead{color:var(--ink2);font-size:.92rem;margin-bottom:18px}
.f{margin-bottom:14px}
.f label{display:block;font-size:.85rem;font-weight:500;margin-bottom:6px}
.f .in{display:flex;border:1px solid var(--field);border-radius:10px;background:var(--surface)}
.f input{flex:1;min-width:0;min-height:44px;padding:0 12px;border:0;background:transparent;border-radius:10px}
.f .in:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.f input:focus-visible{outline:none}
.f .in.bad{border-color:var(--crit)}
.f .err{color:var(--crit);font-size:.82rem;margin-top:6px}
.f .eye{border:0;background:transparent;padding:0 12px;font-size:.82rem;color:var(--ink2);border-radius:10px;min-width:64px}
.lcard .btn{width:100%}
.lcard .or{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:.8rem;margin:14px 0}
.lcard .or:before,.lcard .or:after{content:"";flex:1;height:1px;background:var(--line)}
.note{font-size:.8rem;color:var(--ink3);margin-top:16px}

/* app shell */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;min-height:64px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .brand{margin-right:auto}
.top .brand .mark{width:32px;height:32px}
.burger{display:none}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--s2);gap:2px}
.seg button{min-height:38px;padding:0 14px;border:0;border-radius:8px;background:transparent;font-size:.85rem;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
[data-theme="escuro"] .seg button[aria-pressed="true"]{background:var(--accent);color:var(--onAccent);box-shadow:none}
.per{display:flex;align-items:center;gap:10px}
.per small{color:var(--ink3);font-size:.78rem;max-width:200px;line-height:1.2}
.shell{display:flex;min-height:calc(100vh - 64px)}
.side{width:232px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:64px;align-self:flex-start;height:calc(100vh - 64px);overflow:auto;transition:width .18s}
.side .grp{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:14px 12px 6px}
.side .nv{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;text-align:left;width:100%;color:var(--ink2);font-weight:500;position:relative}
.side .nv:hover{background:var(--s2)}
.side .nv[aria-current="page"]{background:var(--accent);color:var(--onAccent)}
.side .nv svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .nv .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--crit);color:var(--surface);font-size:.72rem;font-weight:600;display:flex;align-items:center;justify-content:center}
[data-theme="escuro"] .side .nv .cnt{color:#1b0b0a}
.side .col{margin-top:auto;display:flex}
.side .col .nv{color:var(--ink3)}
.shell.mini .side{width:68px}
.shell.mini .side .lb,.shell.mini .side .grp,.shell.mini .side .cnt{display:none}
.shell.mini .side .nv{justify-content:center;padding:0}
.shell.mini .side .col .nv svg{transform:rotate(180deg)}
.main{flex:1;min-width:0;padding:24px 28px 56px}
.wrap{max-width:1280px;margin:0 auto}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:1.65rem;line-height:1.2;letter-spacing:-.01em}
.ph h1:focus{outline:none}
.sub{color:var(--ink2);font-size:.95rem;margin-top:4px;max-width:64ch}

/* cards */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{container-type:inline-size;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:1rem;font-weight:600;line-height:1.3}
.card .cs{color:var(--ink3);font-size:.82rem;margin-top:2px}
.card .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:16px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.kpi .l{font-size:.82rem;color:var(--ink3);font-weight:500}
.kpi .v{font-size:1.85rem;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:4px 0}
.kpi .d{font-size:.82rem;color:var(--ink2)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.st.crit{background:var(--critBg);color:var(--crit)}
.st.warn{background:var(--warnBg);color:var(--warn)}
.st.ok{background:var(--okBg);color:var(--ok)}
.st.info{background:var(--infoBg);color:var(--info)}
.st.mut{background:var(--s2);color:var(--ink2)}
.tx-ok{color:var(--ok)}.tx-crit{color:var(--crit)}.tx-warn{color:var(--warn)}

/* decisao */
.dec{border-left:4px solid var(--crit);padding:0}
.dec.none{border-left-color:var(--ok)}
.dec .hd{padding:18px 20px 0;margin:0}
.dr{display:flex;align-items:center;gap:16px;padding:14px 20px;border-top:1px solid var(--line)}
.dr:first-of-type{margin-top:12px}
.dr .tt{flex:1;min-width:0}
.dr b{display:block;font-weight:600}
.dr span.m{display:block;color:var(--ink2);font-size:.88rem}
.dr .rec{color:var(--ink);font-size:.88rem;margin-top:2px}
.empty{padding:28px 20px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* barras horizontais */
.hb{display:grid;gap:12px}
.hr{display:grid;grid-template-columns:100px 1fr auto;align-items:center;gap:12px;font-size:.88rem}
.hr .n{font-weight:500}
.tr{position:relative;height:14px;border-radius:7px;background:var(--s2);overflow:visible}
.fl{height:100%;border-radius:7px;background:var(--c3)}
.fl.crit{background:var(--crit)}.fl.warn{background:var(--warn)}.fl.ok{background:var(--accent)}.fl.mut{background:var(--c2)}
.mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.hr .vv{text-align:right;min-width:0;display:flex;justify-content:flex-end;align-items:center;gap:8px}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--ink2);margin-top:12px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lg .mkl{display:inline-block;width:2px;height:12px;background:var(--ink);margin-right:6px;vertical-align:-2px}
.stk{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--s2)}
.stk span{display:block;height:100%}

/* svg charts */
.ch svg{display:block;width:100%;height:auto;overflow:visible}
.ch text{fill:var(--ink3);font-size:11px;font-family:inherit}
.ch .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.ch .vl{fill:var(--ink);font-size:11px;font-weight:600}
.ch .ref{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4}
.ch .reft{fill:var(--ink);font-size:11px;font-weight:500}

/* donut */
.dn{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.dn svg{width:150px;height:150px;flex:none}
.dn .ctr{font-size:20px;font-weight:600;fill:var(--ink)}
.dn .cts{font-size:9px;fill:var(--ink3)}
.dl{flex:1;min-width:170px;display:grid;gap:8px;font-size:.88rem}
.dl div{display:flex;align-items:center;gap:8px}
.dl i{width:10px;height:10px;border-radius:3px;flex:none}
.dl .p{margin-left:auto;font-weight:600}

/* funil */
.fn{display:grid;gap:10px}
.fs{display:grid;gap:4px}
.fs .t{display:flex;justify-content:space-between;font-size:.88rem}
.fs .b{height:34px;border-radius:8px;background:var(--accent);margin:0 auto;display:flex;align-items:center;justify-content:center;color:var(--onAccent);font-weight:600;font-size:.88rem}
.cv{text-align:center;font-size:.78rem;color:var(--ink3)}

/* tabelas pequenas */
.tb{width:100%;border-collapse:collapse;font-size:.88rem}
.tb th,.tb td{padding:8px 6px;border-top:1px solid var(--line);text-align:right}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb thead th{border-top:0;color:var(--ink3);font-weight:500;font-size:.78rem}
.sel{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink2)}
.sel select{min-height:40px;padding:0 10px;border:1px solid var(--field);border-radius:8px;background:var(--surface)}
.big{font-size:2.4rem;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.row2{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* alertas */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--s2);border-radius:12px;margin-bottom:16px;overflow:auto}
.tabs button{flex:1;min-height:40px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-weight:500;color:var(--ink2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
[data-theme="escuro"] .tabs button[aria-selected="true"]{background:var(--accent);color:var(--onAccent);box-shadow:none}
.al{display:flex;gap:16px;align-items:flex-start;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c2);border-radius:var(--r);margin-bottom:10px}
.al.crit{border-left-color:var(--crit)}.al.warn{border-left-color:var(--warn)}.al.info{border-left-color:var(--info)}.al.done{opacity:.8}
.al .tt{flex:1;min-width:0}
.al .tt b{display:block;font-weight:600}
.al .tt p{color:var(--ink2);font-size:.9rem;margin:2px 0 6px}
.al .mt{font-size:.8rem;color:var(--ink3)}
.al .rec{font-size:.88rem;margin-bottom:4px}

/* drawer / modal */
.ov{position:fixed;inset:0;background:rgba(8,12,18,.55);z-index:90;display:flex;justify-content:flex-end}
.ov.mid{justify-content:center;align-items:center;padding:16px}
.dw{width:min(520px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
.dw .dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 12px;position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line)}
.dw .dh h2{font-size:1.2rem;line-height:1.3}
.dw .db{padding:18px 22px;display:grid;gap:18px}
.dw .df{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:14px 22px;display:flex;gap:10px;flex-wrap:wrap}
.blk h3{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;font-weight:600}
.recbox{border:1px solid var(--accent);border-radius:12px;padding:14px 16px;background:var(--s2)}
.recbox b{display:block;margin-bottom:4px}
.ba{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 14px;align-items:center;font-size:.9rem;margin-top:10px}
.ba .h{color:var(--ink3);font-size:.76rem}
.cf{border:1px solid var(--warn);background:var(--warnBg);color:var(--ink);border-radius:12px;padding:14px 16px}
.dn2{border:1px solid var(--ok);background:var(--okBg);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.mdl{width:min(640px,100%);max-height:90vh;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.mdl .dh{padding:20px 22px 12px;display:flex;justify-content:space-between;gap:12px}
.mdl .tabs{margin:0 22px 12px}
.mdl .db{padding:0 22px 22px;overflow:auto;display:grid;gap:12px}
.ins{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ins .r{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ins b{font-weight:600}
.ins p{color:var(--ink2);font-size:.9rem;margin:4px 0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.78rem;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--ink2)}

/* popover */
.pop{position:absolute;top:56px;right:12px;z-index:80;width:min(340px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:8px}
.pop .ph2{padding:8px 10px;font-weight:600}
.pop .it{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:10px;min-height:44px}
.pop .it:hover{background:var(--s2)}
.pop .it small{display:block;color:var(--ink3);font-size:.78rem}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.pop .th{display:flex;gap:8px;padding:6px 10px;align-items:center;justify-content:space-between;font-size:.88rem}

/* chat */
.chat{position:fixed;right:20px;bottom:20px;z-index:70}
.fab{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--onAccent);box-shadow:0 6px 20px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cp{width:min(380px,calc(100vw - 24px));height:min(560px,calc(100vh - 100px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
.cp .ch2{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.cp .ch2 b{display:block}.cp .ch2 span{font-size:.78rem;color:var(--ink3)}
.cm{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;font-size:.9rem;white-space:pre-wrap}
.msg.bot{background:var(--s2);align-self:flex-start}
.msg.me{background:var(--accent);color:var(--onAccent);align-self:flex-end}
.msg button.lk{display:block;margin-top:8px;border:1px solid var(--field);background:var(--surface);border-radius:8px;padding:6px 10px;min-height:36px;font-size:.82rem}
.sg{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.sg button{border:1px solid var(--field);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.82rem;min-height:36px}
.sg button:hover{background:var(--s2)}
.cf2{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.cf2 input{flex:1;min-width:0;min-height:44px;padding:0 12px;border:1px solid var(--field);border-radius:10px;background:var(--surface)}
.cf2 .btn{padding:0 14px}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:120;font-size:.9rem}
#toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
@media (max-width:900px){
 .burger{display:inline-flex}
 .side{position:fixed;left:0;top:64px;z-index:60;transform:translateX(-100%);transition:transform .2s;width:260px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
 .shell.open .side{transform:none}
 .shell.mini .side{width:260px}
 .shell.mini .side .lb,.shell.mini .side .grp{display:block}
 .shell.mini .side .cnt{display:flex}
 .shell.mini .side .nv{justify-content:flex-start;padding:0 12px}
 .side .col{display:none}
 .main{padding:18px 14px 90px}
 .per small{display:none}
 .sum{grid-template-columns:1fr}
 .scrim.on{display:block;position:fixed;inset:64px 0 0 0;background:rgba(8,12,18,.5);z-index:55}

function spark(vals, labels, ref, name) {
  const W = 420, H = 130, L = 36, R = 14, T = 14, Bt = 24, lo = Math.floor(Math.min.apply(null, vals.concat([ref])) - 1), hi = Math.ceil(Math.max.apply(null, vals.concat([ref])) + 1), ih = H - T - Bt;

  let s = '<line class="ref" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(ref) + '" y2="' + Y(ref) + '"/><text class="reft" x="' + (W - R) + '" y="' + (Y(ref) - 5) + '" text-anchor="end">meta ' + ref + '%</text>';

function go(v, push) { if (!VIEWS[v]) v = 'estrategico'; S.view = v; closePop(); $('#shell').classList.remove('open'); $('#scrim').classList.remove('on'); $('#burger').setAttribute('aria-expanded', 'false'); if (push !== false && location.hash !== '#/' + v) { try { history.replaceState(null, '', '#/' + v); } catch (e) { } } render(true); }
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 3200); }
function setTheme(t) { S.theme = t; document.documentElement.setAttribute('data-theme', t); }

function closePop() { const p = $('#pop'); if (!p.hidden) { p.hidden = true; $$('[aria-expanded="true"]', $('.top')).forEach(b => b.setAttribute('aria-expanded', 'false')); } }
function openPop(kind, btn) {

/* ---------- camadas: detalhe do alerta e insights ---------- */
function fxTable(a) { return a.rec.fx ? '<div class="ba" role="table" aria-label="Efeito estimado"><span class="h" role="columnheader">Indicador</span><span class="h" role="columnheader">Antes</span><span class="h" role="columnheader"></span><span class="h" role="columnheader">Depois</span>' + a.rec.fx.map(r => '<span role="cell">' + r[0] + '</span><span class="num" role="cell">' + r[1] + '</span><span role="cell" aria-hidden="true">→</span><b class="num" role="cell">' + r[2] + '</b>').join('') + '</div>' : ''; }
function drawerHTML(a) {
  const open = isOpen(a), cf = S.confirm === a.id;
  let foot = '';
  if (open && a.rec) foot = cf ? '' : '<button class="btn pri" data-act="ask" data-id="' + a.id + '">' + a.rec.cta + '</button><button class="btn" data-act="snooze" data-id="' + a.id + '">Adiar 4 h</button><button class="btn ghost" data-act="dismiss" data-id="' + a.id + '">Dispensar</button>';

  return '<aside class="dw" role="dialog" aria-modal="true" aria-labelledby="dwt"><div class="dh"><div>' + st(a.sev, SEVI[a.sev] + ' ' + SEVN[a.sev]) + '<h2 id="dwt" style="margin-top:8px">' + esc(a.title) + '</h2><p class="cs">' + a.area + ' · ' + a.when + '</p></div><button class="ibtn" data-close aria-label="Fechar">✕</button></div><div class="db">' +
    (!open ? '<div class="dn2"><span><b>✓ ' + esc(lbl) + (a.at ? ' às ' + a.at : '') + '</b></span>' + (a.st !== 'lido' ? '<button class="btn sm" data-act="undo" data-id="' + a.id + '">Desfazer</button>' : '') + '</div>' : '') +
    '<div class="blk"><h3>O que está acontecendo</h3><p>' + esc(a.desc) + '</p>' + (a.trend ? spark(a.trend, a.tl, a.ref, a.tname) : '') + '</div>' +
    (a.rec ? '<div class="blk"><h3>Recomendação da IA</h3><div class="recbox"><b>' + esc(a.rec.t) + '</b><span>' + esc(a.rec.x) + '</span>' + fxTable(a) + '</div></div>' : '') +

    '</div>' + (foot ? '<div class="df">' + foot + '</div>' : '') + '</aside>';
}
function openLayer(html, mid, opener) { S.opener = opener || document.activeElement; const l = $('#layer'); l.innerHTML = '<div class="ov' + (mid ? ' mid' : '') + '" id="ov">' + html + '</div>'; S.layer = true; const f = $('[data-close]', l) || $('button', l); if (f) f.focus(); }
function closeLayer() { if (!S.layer) return; $('#layer').innerHTML = ''; S.layer = null; S.confirm = null; const o = S.opener; if (o && document.contains(o)) o.focus(); }
function openAlert(id, opener) { S.confirm = null; if (S.layer) { $('#layer').innerHTML = ''; S.layer = null; } closePop(); openLayer(drawerHTML(AL[id]), false, opener); S.cur = id; }
function refreshDrawer(focusSel) { if (!S.layer || !S.cur) return; $('#ov').innerHTML = drawerHTML(AL[S.cur]); const f = focusSel && $(focusSel, $('#ov')) || $('[data-close]', $('#ov')); if (f) f.focus(); }
const INS = [
  { k: 'ok', t: 'Crescimento sustentável', x: 'O faturamento de outubro foi R$ 8,0M, 8,1% acima de setembro. Em 12 meses, soma R$ 80,0M.', r: 'Manter a expansão nos CDs 1 e 2, que concentram 62,5% do faturamento.', c: ['Out: R$ 8,0M (+8,1%)', '12 meses: R$ 80,0M'] },
  { k: 'warn', t: 'Concentração na Logística', x: 'A Logística responde por 60% do faturamento e por 52 dos 90 clientes.', r: 'Aumentar a participação de Crossdocking e Marketplace para reduzir o risco da carteira.', c: ['Logística: 60%', 'Crossdocking: 20%', 'Marketplace: 15%'] },
  { k: 'warn', t: 'Prazo de recebimento longo', x: '45 dos 90 clientes (50%) só recebem em até 90 dias.', r: 'Rever as condições comerciais dos clientes de maior prazo.', c: ['Até 15 dias: 5', 'Até 90 dias: 45'] },
  { k: 'info', t: 'Sazonalidade', x: 'Os maiores faturamentos dos últimos 12 meses foram outubro (R$ 8,0M) e setembro (R$ 7,4M).', r: 'Reforçar a capacidade operacional no último trimestre. Veja a recomendação do CD 2.', c: ['Pico: R$ 8,0M', 'Média: R$ ' + nf(FAT12 / 12, 1) + 'M'], link: 'a-cd2' },
  { k: 'ok', t: 'Faltas e avarias dentro da meta', x: 'A taxa global é 1,0%, abaixo da meta de 2%.', r: 'Manter a conferência reforçada nos CDs 2 e 3, que têm os maiores índices.', c: ['Global: 1,0%', 'CD 2: 1,4%', 'CD 3: 1,1%'] }
];
const INK = { ok: ['ok', '✓ Sucesso'], warn: ['warn', '▲ Alerta'], info: ['info', 'i Informação'] };
function insightsHTML() {
  const f = { todos: INS, ok: INS.filter(i => i.k === 'ok'), warn: INS.filter(i => i.k === 'warn'), info: INS.filter(i => i.k === 'info') }[S.itab];

/* ---------- ações sobre alertas ---------- */
const now = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
function setSt(id, s, msg) { const a = AL[id]; a.st = s; a.at = s === 'aberto' ? '' : now(); S.confirm = null; render(false); refreshDrawer(s === 'aberto' ? '[data-act="ask"]' : null); toast(msg); $('#live').textContent = msg; }
function act(k, id) {
  if (k === 'ask') { S.confirm = id; refreshDrawer('[data-act="apply"]'); }
  else if (k === 'cancel') { S.confirm = null; refreshDrawer('[data-act="ask"]'); }
  else if (k === 'apply') { const a = AL[id]; setSt(id, id === 'a-inad' ? 'encaminhado' : 'resolvido', a.rec.done + '. Indicadores atualizados.'); }
  else if (k === 'snooze') setSt(id, 'adiado', 'Alerta adiado por 4 horas.');
  else if (k === 'dismiss') setSt(id, 'dispensado', 'Alerta dispensado.');
  else if (k === 'read') setSt(id, 'lido', 'Marcado como lido.');
  else if (k === 'undo') setSt(id, 'aberto', 'Ação desfeita. O alerta voltou a aberto.');
  else if (k === 'reset') { ALIST.forEach(a => { a.st = 'aberto'; a.at = ''; }); S.msgs = []; closePop(); closeLayer(); render(false); toast('Demonstração reiniciada.'); }
  else if (k === 'logout') { closePop(); closeLayer(); S.auth = false; $('#app').hidden = true; $('#chat').hidden = true; $('#login').hidden = false; $('#lu').focus(); }
}

/* ---------- chat Chronus AI: responde com os dados do painel ---------- */
function answer(q) {
  const t = q.toLowerCase(), m = t.match(/cd ?([1-5])/), l = needAct();
  if (m) { const i = +m[1] - 1, o = occSt(occ(i)), s = slaSt(sla(i)); return { x: CDS[i] + ': ocupação ' + pct(occ(i), 0) + ' (' + o[1].slice(2) + '), SLA ' + pct(sla(i)) + ' (' + s[1].slice(2) + '), TFA ' + pct(B.tfa[i]) + ' e faturamento de ' + money(B.fat[i]) + ' em 12 meses.', go: i === 1 && isOpen(AL['a-cd2']) ? 'a-cd2' : i === 2 && isOpen(AL['a-cd3']) ? 'a-cd3' : null }; }
  if (/decis|urgen|priorid|exige|preciso fazer|pendente|alerta/.test(t)) return l.length ? { x: l.length + ' item(ns) pedem sua decisão:\n' + l.map(a => '• ' + a.title).join('\n'), go: l[0].id } : { x: 'Nada exige sua decisão agora. Os alertas críticos e de atenção foram tratados.' };
  if (/pior|cr[ií]tic|problema|risco/.test(t)) { const w = CDS.map((_, i) => i).sort((a, b) => sla(a) - sla(b))[0]; return { x: 'O ' + CDS[w] + ' tem o menor SLA: ' + pct(sla(w)) + ' (meta ' + META_SLA + '%), com ocupação de ' + pct(occ(w), 0) + '.', go: w === 1 && isOpen(AL['a-cd2']) ? 'a-cd2' : null }; }
  if (/sla/.test(t)) return { x: 'SLA global: ' + pct(slaG()) + ' (meta ' + META_SLA + '%).\n' + CDS.map((c, i) => c + ': ' + pct(sla(i))).join(' · ') };
  if (/ocupa|capacidade/.test(t)) return { x: 'Ocupação média ponderada: ' + pct(occG(), 0) + '.\n' + CDS.map((c, i) => c + ': ' + pct(occ(i), 0)).join(' · ') + '\nLimite operacional: ' + LIM_OCC + '%.' };
  if (/caixa|receb|pagar/.test(t)) return { x: 'Em 12 meses: a receber ' + money(REC12) + ' e a pagar ' + money(PAG12) + ', resultado de +' + money(REC12 - PAG12) + '. Em outubro: ' + money(SER.rec.mes[11]) + ' a receber contra ' + money(SER.pag.mes[11]) + ' a pagar.' };
  if (/inadimpl/.test(t)) return { x: 'Inadimplência global: ' + pct(SER.inad.mes[11]) + ' (meta abaixo de 3%). O Marketplace está em 3,8%, acima da meta.', go: isOpen(AL['a-inad']) ? 'a-inad' : null };
  if (/fatur|receita/.test(t)) return { x: 'Faturamento de ' + money(FAT12) + ' em 12 meses. Outubro: ' + money(SER.fat.mes[11]) + ', ' + pct(FAT_DELTA) + ' acima de setembro. Os CDs 1 e 2 concentram 62,5%.' };
  if (/custo/.test(t)) return { x: 'Custo operacional do mês: ' + money(sum(B.custo)) + ', dentro do orçamento de ' + money(ORC) + '.' };
  if (/funil|venda|convers/.test(t)) return { x: 'De 100 leads, 25 viram clientes (25%). A maior perda está entre proposta e cliente: metade não avança.' };
  if (/score|carteira|cliente/.test(t)) return { x: 'Score médio da carteira: ' + nf(SCORE, 0) + ' em ' + CLI + ' clientes ativos. O Marketplace tem o menor score (68).' };
  if (/resum|semana|geral|como estamos/.test(t)) return { x: 'Resumo: faturamento de ' + money(FAT12) + ' em 12 meses, SLA global ' + pct(slaG()) + ', inadimplência ' + pct(SER.inad.mes[11]) + '. ' + (l.length ? l.length + ' item(ns) pedem decisão.' : 'Nada pede decisão agora.'), go: l[0] && l[0].id };
  return { x: 'Ainda não sei responder isso com os dados do painel. Posso falar de decisões pendentes, SLA, ocupação, caixa, inadimplência, faturamento, custo, vendas, score e de cada CD (ex.: "como está o CD 3?").' };
}
function renderChat() {
  const c = $('#chat');
  if (!S.chatOpen) { c.innerHTML = '<button class="fab" id="fab" aria-label="Abrir o assistente Chronus AI">' + svgi('chat') + '</button>'; return; }
  c.innerHTML = '<div class="cp" role="dialog" aria-label="Chronus AI, assistente"><div class="ch2"><div><b>Chronus AI</b><span>Responde com os dados deste painel</span></div><button class="ibtn" id="cclose" aria-label="Fechar o assistente">✕</button></div><div class="cm" id="cm" role="log" aria-live="polite">' +
    '<div class="msg bot">Olá! Sou o Chronus AI. Pergunte sobre o que exige decisão, SLA, ocupação, caixa ou qualquer CD.</div>' +
    S.msgs.map(m => '<div class="msg ' + m.r + '">' + esc(m.x).replace(/\n/g, '<br>') + (m.go ? '<button class="lk" data-alert="' + m.go + '">Abrir o alerta</button>' : '') + '</div>').join('') + '</div>' +
    '<div class="sg">' + ['O que exige minha decisão?', 'Qual CD está pior?', 'Como está o caixa?', 'Resuma a situação'].map(q => '<button data-q="' + q + '">' + q + '</button>').join('') + '</div>' +
    '<form class="cf2" id="cform"><label class="sr" for="cin">Mensagem</label><input id="cin" placeholder="Digite sua pergunta" autocomplete="off"><button class="btn pri" type="submit">Enviar</button></form></div>';
  const m = $('#cm'); m.scrollTop = m.scrollHeight; $('#cin').focus();
}
function ask(q) { q = q.trim(); if (!q) return; S.msgs.push({ r: 'me', x: q }); renderChat(); setTimeout(() => { const a = answer(q); S.msgs.push({ r: 'bot', x: a.x, go: a.go }); renderChat(); }, 350); }

function enter() { S.auth = true; $('#login').hidden = true; $('#app').hidden = false; $('#chat').hidden = false; renderChat(); const v = (location.hash.match(/#\/(\w+)/) || [])[1]; go(VIEWS[v] ? v : 'estrategico', false); }

  e.preventDefault(); let bad = null;
  [['lu', 'lu-e', 'lu-w'], ['lp', 'lp-e', 'lp-w']].forEach(k => { const empty = !$('#' + k[0]).value.trim(); $('#' + k[1]).hidden = !empty; $('#' + k[2]).classList.toggle('bad', empty); $('#' + k[0]).setAttribute('aria-invalid', empty); if (empty && !bad) bad = k[0]; });
  if (bad) $('#' + bad).focus(); else enter();
});

$('#eye').addEventListener('click', e => { const i = $('#lp'), s = i.type === 'password'; i.type = s ? 'text' : 'password'; e.currentTarget.textContent = s ? 'Ocultar' : 'Mostrar'; e.currentTarget.setAttribute('aria-pressed', s); });

/* ---------- eventos ---------- */
document.addEventListener('click', e => {

  else if (t.dataset.period) { S.per = t.dataset.period; render(false); const b = $('[data-period="' + S.per + '"]'); if (b) b.focus(); $('#live').textContent = 'Período: ' + PER[S.per].n; }
  else if (t.dataset.tab) { S.atab = t.dataset.tab; render(false); const b = $('[data-tab="' + S.atab + '"]'); if (b) b.focus(); }
  else if (t.dataset.itab) { S.itab = t.dataset.itab; $('#ov').innerHTML = insightsHTML(); const b = $('[data-itab="' + S.itab + '"]'); if (b) b.focus(); }
  else if (t.dataset.themeSet) { setTheme(t.dataset.themeSet); $$('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeSet === S.theme)); }
  else if (t.dataset.q) ask(t.dataset.q);
  else if (t.id === 'bell') openPop('bell', t);
  else if (t.id === 'avb') openPop('acc', t);
  else if (t.id === 'insb') { S.itab = 'todos'; openLayer(insightsHTML(), true, t); }
  else if (t.id === 'colb') { S.mini = !S.mini; renderSide(); $('#colb').focus(); }
  else if (t.id === 'burger') { const o = $('#shell').classList.toggle('open'); $('#scrim').classList.toggle('on', o); t.setAttribute('aria-expanded', o); }
  else if (t.id === 'fab') { S.chatOpen = true; renderChat(); }
  else if (t.id === 'cclose') { S.chatOpen = false; renderChat(); $('#fab').focus(); }
});
$('#scrim').addEventListener('click', () => { $('#shell').classList.remove('open'); $('#scrim').classList.remove('on'); $('#burger').setAttribute('aria-expanded', 'false'); });
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.sel; if (!k) return; S.sel[k] = +e.target.value; render(false); const s = $('[data-sel="' + k + '"]'); if (s) s.focus(); });
document.addEventListener('submit', e => { if (e.target.id === 'cform') { e.preventDefault(); const i = $('#cin'); const v = i.value; ask(v); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.layer) closeLayer(); else if (!$('#pop').hidden) { closePop(); const b = $('#bell'); b.focus(); } else if (S.chatOpen) { S.chatOpen = false; renderChat(); $('#fab').focus(); } }
  else if (e.key === 'Tab' && S.layer) { const f = $$('button,[href],input,select', $('#ov')).filter(x => !x.disabled && x.offsetParent !== null || true); if (!f.length) return; const a = f[0], z = f[f.length - 1]; if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); } }
  else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.getAttribute && e.target.getAttribute('role') === 'tab') { const tabs = $$('[role="tab"]', e.target.parentNode), i = tabs.indexOf(e.target), n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length]; n.focus(); n.click(); const again = $('[role="tab"][aria-selected="true"]', $('#layer').innerHTML ? $('#layer') : document); if (again) again.focus(); }
});
window.addEventListener('hashchange', () => { if (!S.auth) return; const v = (location.hash.match(/#\/(\w+)/) || [])[1]; if (v && v !== S.view) go(v, false); });
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) setTheme('escuro');
window.__torre = { S: S, AL: AL, go: go, enter: enter };
})();
