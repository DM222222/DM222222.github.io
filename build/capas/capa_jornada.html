.tag{position:absolute;display:flex;align-items:center;gap:12px;font-size:22px;font-weight:600;color:#1A1426;z-index:9;letter-spacing:-.01em}
.tag b{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#1A1426;color:#C6DE64;font-size:18px}
.tag.on-plum{color:#fff}
svg.thread{position:absolute;inset:0;z-index:2}
