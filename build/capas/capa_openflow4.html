<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1600px;height:800px;overflow:hidden}
body{background:#F3EFF8;position:relative;font-family:"Inter","Segoe UI",system-ui,sans-serif}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(105,69,141,.16) 1.3px,transparent 1.8px);background-size:22px 22px}
.shape{position:absolute;border-radius:50%}
.f{position:absolute;overflow:hidden;background:#fff;border-radius:12px;box-shadow:0 30px 60px rgba(38,24,60,.18),0 4px 12px rgba(38,24,60,.10),0 0 0 1px rgba(26,20,38,.06);z-index:3}
.f img{display:block;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;display:flex;align-items:center;gap:12px;font-size:22px;font-weight:600;color:#1A1426;z-index:9;letter-spacing:-.01em}
.tag b{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#1A1426;color:#C6DE64;font-size:18px}
.tag.on-plum{color:#fff}
svg.thread{position:absolute;inset:0;z-index:2}
</style></head><body>
